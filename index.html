
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Countdown Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Quicksand,sans-serif;background:linear-gradient(135deg,#ffe6f0,#ffd6ea);padding:40px}
h1{text-align:center;font-family:"Great Vibes",cursive;font-size:54px;color:#d81b60}
.wrapper{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1200px;margin:30px auto}
.card{background:rgba(255,255,255,.35);backdrop-filter:blur(10px);border-radius:20px;padding:25px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.months{font-weight:bold;color:#d81b60;margin:12px 0}
.timer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* Card Box Styling */
.box{background:#fff;color:#333;border-radius:10px;padding:10px;min-width:60px;text-align:center}
.box b{display:block;font-size:22px;color:#d81b60}

button{margin-top:18px;border:0;background:#d81b60;color:#fff;padding:12px 22px;border-radius:25px;cursor:pointer;font-weight:bold}

/* Popup Styles */
.popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1000;overflow:hidden}
.popup.active{display:flex}

/* Replaced video element with img element to correctly display GIFs */
.popup .bg-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:2}
.content{position:relative;z-index:3;color:#fff;text-align:center;max-width:700px;padding:20px}
.content .months{color:#ff80ab}

.close{background:#fff;color:#d81b60}
</style>
</head>
<body>
<h1>Our Journey ❤️</h1>
<div class="wrapper" id="cards"></div>

<div class="popup" id="popup">
  <!-- Changed from <video> to <img> so the GIF displays properly -->
  <img id="bgMedia" class="bg-media" alt="Background Animation">
  <div class="overlay"></div>
  <div class="content">
    <h2 id="popTitle" style="font-size: 32px; margin-bottom: 5px;"></h2>
    <div class="months" id="popMonths"></div>
    <div class="timer" id="popTimer"></div>
    <p id="dates" style="margin-top: 20px; line-height: 1.6;"></p>
    <button class="close" onclick="popup.classList.remove('active')">Close</button>
  </div>
</div>

<script>
const events=[
  {title:"Time to Our Wedding",date:"2026-12-10T06:00:00",video:"https://res.cloudinary.com/dff4rbfkn/image/upload/v1784968989/tumblr_ocqmtbtWiI1rlnjw2o1_1280_ur0pig.gif"},
  {title:"Time to Honeymoon",date:"2026-12-11T09:00:00",video:"https://res.cloudinary.com/dff4rbfkn/image/upload/v1784967900/m_ldpwiqacxtE_Ai_mh_R2r-lm_RBve6ZCQH_51966511b_i2cugj.gif"},
  {title:"Time to Next Visit",date:"2026-09-12T08:00:00",video:"https://res.cloudinary.com/dff4rbfkn/image/upload/v1784970034/24886935_u8ewgv.gif"}
];

const cards=document.getElementById("cards");
events.forEach((e,i)=>{
  cards.innerHTML+=`<div class="card"><h2>${e.title}</h2><div class="months" id="m${i}"></div>
  <div class="timer" id="t${i}"></div><button onclick="openPop(${i})">See the Dates</button></div>`;
});

function monthsLeft(n,t){
  let m=(t.getFullYear()-n.getFullYear())*12+t.getMonth()-n.getMonth();
  if(t.getDate()<n.getDate())m--;
  return Math.max(m,0)
}

function boxes(d,h,m,s){
  return `<div class="box"><b>${d}</b>Days</div><div class="box"><b>${h}</b>Hours</div><div class="box"><b>${m}</b>Min</div><div class="box"><b>${s}</b>Sec</div>`
}

function tick(){
  const now=new Date();
  events.forEach((e,i)=>{
    let t=new Date(e.date),dist=t-now;
    let d=Math.max(0,Math.floor(dist/86400000));
    let h=Math.max(0,Math.floor(dist%86400000/3600000));
    let mi=Math.max(0,Math.floor(dist%3600000/60000));
    let s=Math.max(0,Math.floor(dist%60000/1000));
    document.getElementById("m"+i).textContent=monthsLeft(now,t)+" Months Remaining";
    document.getElementById("t"+i).innerHTML=boxes(d,h,mi,s);
  });

  if(window.current!=null){
    let e=events[current],t=new Date(e.date),dist=t-now;
    popTitle.textContent=e.title;
    popMonths.textContent=monthsLeft(now,t)+" Months Remaining";
    popTimer.innerHTML=boxes(
      Math.max(0,Math.floor(dist/86400000)),
      Math.max(0,Math.floor(dist%86400000/3600000)),
      Math.max(0,Math.floor(dist%3600000/60000)),
      Math.max(0,Math.floor(dist%60000/1000))
    );
    dates.innerHTML="Today: "+now.toDateString()+"<br>Event: "+t.toDateString();
  }
}

function openPop(i){
  window.current=i;
  document.getElementById("bgMedia").src=events[i].video;
  popup.classList.add("active");
  tick();
}

tick();
setInterval(tick,1000);
</script>
</body>
</html>
